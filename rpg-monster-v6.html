<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0a0806"><title>百首異聞｜序章トライアル</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0806}iframe{display:block;width:100%;height:100dvh;border:0;background:#0a0806}</style></head><body><iframe id="game" src="rpg-monster-v5.html" title="百首異聞 RPG"></iframe><script>const f=document.getElementById('game');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;const s=d.createElement('style');s.id='training-card-direction';s.textContent=`/* トレーニング画面と同じ札の文字方向を共通化 */
.card{direction:rtl!important}
.card .col{writing-mode:vertical-rl!important;text-orientation:upright!important}
`;d.head.appendChild(s);const notes=d.querySelectorAll('.note');notes.forEach(n=>{if(n.textContent.includes('ひだり'))n.textContent=n.textContent.replace(/ひだり[^。]*。?/g,'トレーニングとおなじく、みぎのれつから よみはじめます。')});});</script></body></html>

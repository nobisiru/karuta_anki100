<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f3efe5"><title>百人一首 決まり字トレーニング</title><style>
:root{--bg:#f3efe5;--paper:#fffef9;--ink:#151515;--green:#315f42;--green2:#244a33;--ok:#16804d;--ng:#b43b30;--muted:#746f66}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100dvh}button{font:inherit}.app{max-width:560px;min-height:100dvh;margin:auto;padding:max(14px,env(safe-area-inset-top)) 10px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.start,.result,.review{flex:1;display:none;align-items:center;justify-content:center;text-align:center}.start.active,.result.active,.review.active{display:flex}.screen{display:none}.screen.active{display:block}.panel{width:100%;background:rgba(255,255,255,.64);border-radius:18px;padding:24px 17px;box-shadow:0 8px 24px rgba(0,0,0,.07)}.panel h1{font-size:28px;margin:0 0 8px}.panel p{color:var(--muted);line-height:1.6;margin:7px 0 15px}.section-title{font-size:13px;font-weight:800;color:#575249;text-align:left;margin:13px 0 7px}.mode-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{border:0;border-radius:13px;background:var(--green);color:#fff;padding:14px 8px;font-size:17px;font-weight:800}.primary:active{background:var(--green2)}.mode-sub{display:block;font-size:10px;font-weight:600;opacity:.8;margin-top:3px}.difficulty{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.diffBtn{border:1px solid #d7d0c5;background:#fff;border-radius:10px;padding:10px 3px;font-size:12px;font-weight:800;color:#4f4a43}.diffBtn.selected{background:var(--green);color:#fff;border-color:var(--green)}.mini,.weak{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.55}.topbar{display:flex;justify-content:space-between;align-items:center;min-height:34px}.brand{font-weight:800;font-size:13px}.progress{font-size:13px;color:var(--muted)}.battlebar{display:flex;justify-content:center;gap:18px;font-size:13px;font-weight:800;margin:4px 0}.you{color:var(--ok)}.cpu{color:#555}.prompt-wrap{text-align:center;margin:5px 0 10px}.label{font-size:10px;color:var(--muted)}.prompt{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:68px;line-height:1;font-weight:700}.upper-rest{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:15px;line-height:1.45;color:#55514a;min-height:43px;margin:4px auto 0;max-width:94%}.hint{font-size:10px;color:var(--muted);margin-top:2px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-items:start}.card{appearance:none;border:0;background:transparent;padding:0;aspect-ratio:.72;perspective:800px;touch-action:manipulation}.card-flipper{position:relative;width:100%;height:100%;transition:transform .42s;transform-style:preserve-3d}.card.revealed .card-flipper{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:2px;box-shadow:0 4px 12px rgba(0,0,0,.12)}.back{background:linear-gradient(145deg,#315f42,#244a33);border:5px solid #315f42}.back:after{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.14)}.front{background:var(--green);padding:6px;transform:rotateY(180deg)}.card-inner{height:100%;width:100%;background:var(--paper);display:flex;justify-content:center;align-items:flex-start;padding:12% 5% 7%;overflow:hidden}.poem-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);direction:rtl;align-items:start}.poem-col{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(16px,5vw,24px);font-weight:500;line-height:1.13;display:flex;flex-direction:column;align-items:center;white-space:nowrap}.poem-char{display:block;height:1.13em}.card.taken .front{background:#858585}.card.taken .card-inner{background:#dedede;color:#888}.card.userwin .front{background:var(--ok)}.card.wrong .front{background:var(--ng)}.cards.five .poem-col{font-size:clamp(14px,4.5vw,21px)}.feedback{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:18px;margin-top:6px}.feedback.ok{color:var(--ok)}.feedback.ng{color:var(--ng)}.score{font-size:52px;font-weight:900;margin:10px 0 14px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.metric{background:#fff;border-radius:12px;padding:12px 4px}.metric .num{font-size:22px;font-weight:900}.metric .cap{font-size:10px;color:var(--muted);margin-top:3px}.review-list{max-height:66dvh;overflow:auto;text-align:left;margin:10px -3px}.review-item{background:#fff;border-radius:12px;padding:11px;margin:7px 0;border-left:5px solid #aaa}.review-item.win{border-left-color:var(--ok)}.review-item.lose{border-left-color:#777}.review-key{font-size:25px;font-family:"Yu Mincho",serif;font-weight:800}.review-upper{font-size:12px;color:#5e5951;margin:2px 0}.review-answer{font-size:14px;font-family:"Yu Mincho",serif;font-weight:700}.review-result{font-size:11px;margin-top:4px;color:var(--muted)}.full{width:100%;margin-top:8px}@media(max-width:390px){.app{padding-left:7px;padding-right:7px}.cards{gap:5px}.front{padding:5px}.poem-col{font-size:clamp(15px,4.85vw,20px)}.cards.five .poem-col{font-size:clamp(13px,4.3vw,18px)}.prompt{font-size:62px}}
</style></head><body><main class="app"><section id="startScreen" class="start active"><div class="panel"><h1>決まり字バトル</h1><p>札は1秒後に一斉に表へ。<br>相手より先に正解札を取ろう。</p><div class="section-title">① 対戦相手の強さ</div><div class="difficulty"><button class="diffBtn selected" data-diff="easy">やさしい<br>10秒</button><button class="diffBtn" data-diff="normal">ふつう<br>5秒</button><button class="diffBtn" data-diff="hard">むずかしい<br>2.5秒</button><button class="diffBtn" data-diff="master">名人<br>1.2秒</button></div><div class="section-title">② 選択肢</div><div class="mode-buttons"><button class="primary modeBtn" data-count="3">3択モード<span class="mode-sub">まず覚える</span></button><button class="primary modeBtn" data-count="5">5択モード<span class="mode-sub">少し実戦的</span></button></div><div class="mini">不正解札は百人一首100枚全体から出題。<br>むずかしい・名人では正解札と下の句の先頭文字が同じ札を優先します。</div></div></section><section id="gameScreen" class="screen"><div class="topbar"><div id="brand" class="brand">3択・やさしい</div><div id="progress" class="progress">1 / 10</div></div><div class="battlebar"><span class="you">あなた <b id="userPts">0</b></span><span>―</span><span class="cpu">相手 <b id="cpuPts">0</b></span></div><div class="prompt-wrap"><div class="label">決まり字</div><div id="prompt" class="prompt">む</div><div id="upperRest" class="upper-rest"></div><div id="hint" class="hint">札が表になるまで1秒…</div></div><div id="cards" class="cards"></div><div id="feedback" class="feedback"></div></section><section id="resultScreen" class="result"><div class="panel"><div style="font-size:13px;color:var(--muted);font-weight:800">10問終了</div><div id="battleResult" class="score">勝利！</div><div class="metrics"><div class="metric"><div id="accuracy" class="num">0%</div><div class="cap">正答率</div></div><div class="metric"><div id="avgTime" class="num">0.0秒</div><div class="cap">平均反応</div></div><div class="metric"><div id="battleScore" class="num">0-0</div><div class="cap">獲得札</div></div></div><button id="reviewBtn" class="primary full">10問をハイライト復習</button><button id="homeBtn" class="primary full" style="background:#69645c">モード選択へ</button></div></section><section id="reviewScreen" class="review"><div class="panel"><h1 style="font-size:23px">10問の復習</h1><p style="margin-bottom:5px">問題・上の句・正解札をまとめて振り返ります。</p><div id="reviewList" class="review-list"></div><button id="reviewHome" class="primary full">もう一度トレーニング</button></div></section></main><script src="data.js"></script><script src="app.js"></script></body></html>

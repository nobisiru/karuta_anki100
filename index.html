<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f3efe5"><title>百人一首 読み取りトレーニング</title><style>
:root{--bg:#f3efe5;--paper:#fffef9;--ink:#151515;--green:#315f42;--green2:#244a33;--ok:#16804d;--ng:#b43b30;--muted:#746f66;--gold:#a77a20;--pale:#e8efe9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100dvh}button,input{font:inherit}.app{max-width:620px;min-height:100dvh;margin:auto;padding:max(14px,env(safe-area-inset-top)) 9px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.page{display:none}.page.active{display:block}.start,.result{flex:1}.panel{width:100%;background:rgba(255,255,255,.68);border-radius:18px;padding:20px 15px;box-shadow:0 8px 24px rgba(0,0,0,.07)}h1{font-size:26px;margin:0 0 7px;text-align:center}.lead{color:var(--muted);line-height:1.55;text-align:center;font-size:13px}.section-title{font-size:13px;font-weight:800;color:#575249;margin:14px 0 7px}.profile-row{display:flex;gap:7px}.profile-row select{min-width:0;flex:1;border:1px solid #d7d0c5;background:#fff;border-radius:10px;padding:11px}.smallbtn{border:0;border-radius:10px;background:#756e64;color:#fff;padding:10px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.choice-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tabBtn,.choiceBtn,.diffBtn{border:1px solid #d7d0c5;background:#fff;border-radius:11px;padding:11px 4px;font-weight:800;color:#4f4a43}.tabBtn.selected,.choiceBtn.selected,.diffBtn.selected{background:var(--green);color:#fff;border-color:var(--green)}.difficulty{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.diffBtn{font-size:11px;padding:9px 2px}.diff-sub{display:block;font-size:8px;font-weight:600;opacity:.78;margin-top:2px}.primary{width:100%;border:0;border-radius:13px;background:var(--green);color:#fff;padding:14px 8px;font-size:17px;font-weight:800;margin-top:13px}.secondary{background:#756e64}.outline{background:#fff;color:var(--green);border:1px solid var(--green)}.mini{font-size:10px;color:var(--muted);margin-top:9px;line-height:1.5;text-align:center}.topbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;min-height:42px}.brand{font-weight:800;font-size:13px}.progress{font-size:13px;color:var(--muted);white-space:nowrap}.flipBtn{width:38px;height:38px;border-radius:50%;border:1px solid #cfc7bb;background:#fff;color:#5f5a52;display:grid;place-items:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.06)}.flipBtn.active{background:var(--gold);color:#fff;border-color:var(--gold)}.flipBtn svg{width:22px;height:22px}.stage{background:#fffaf0;border-radius:16px;padding:9px 7px;margin:5px 0 10px;text-align:center}.status{font-size:11px;color:var(--muted);font-weight:700}.stream{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:31px;font-weight:800;min-height:48px;letter-spacing:.055em;margin:6px 0 1px}.stream .kimari{color:var(--gold);text-decoration:underline;text-underline-offset:5px}.help{font-size:11px;color:#6b655c;min-height:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:start}.card{appearance:none;border:0;background:transparent;padding:0;aspect-ratio:.72}.front{background:var(--green);padding:5px;border-radius:2px;box-shadow:0 4px 11px rgba(0,0,0,.12);height:100%;transition:transform .22s ease}.cards.upside-down .front{transform:rotate(180deg)}.card-inner{height:100%;background:var(--paper);padding:9% 4% 6%;overflow:hidden}.poem-grid{height:100%;display:grid;grid-template-columns:repeat(3,1fr);direction:rtl}.poem-col{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(15px,4.6vw,22px);line-height:1.1;display:flex;flex-direction:column;align-items:center;white-space:nowrap}.poem-char{height:1.1em}.card.correct .front{background:var(--ok)}.card.wrong .front{background:var(--ng)}.cards.six .poem-col{font-size:clamp(13px,3.8vw,18px)}.cards.nine .poem-col{font-size:clamp(11px,3.2vw,16px)}.feedback{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:17px;margin-top:5px}.feedback.ok{color:var(--ok)}.feedback.ng{color:var(--ng)}.retryBtn{display:none;width:100%;border:1px solid var(--ng);background:#fff;color:var(--ng);border-radius:12px;padding:11px 8px;font-size:15px;font-weight:800;margin-top:2px}.retryBtn.show{display:block}.char-result{font-family:"Yu Mincho",serif;font-size:31px;font-weight:900;color:var(--gold);margin:6px 0;text-align:center}.summary{text-align:center;font-size:13px;color:#5c574f;line-height:1.6}.review-list{max-height:45dvh;overflow:auto;text-align:left;margin:10px -2px}.read-row{display:flex;justify-content:space-between;gap:8px;background:#fff;border-radius:10px;padding:9px 10px;margin:6px 0}.good{color:var(--ok);font-weight:800}.late{color:var(--gold);font-weight:800}.full{width:100%;margin-top:8px}
/* infographic dashboard */.dash-panel{padding:14px 12px 18px}.dash-kicker{text-align:center;font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:900}.dash-hero{display:grid;grid-template-columns:145px 1fr;gap:12px;align-items:center;margin:10px 0 14px}.ring{width:136px;height:136px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--green) 0deg,#e5dfd4 0deg)}.ring:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1px #eee5d8}.ring-inner{position:relative;z-index:1;text-align:center}.ring-num{font-size:29px;font-weight:900;color:var(--green2)}.ring-cap{font-size:9px;color:var(--muted);font-weight:700}.hero-copy{background:#fffaf0;border-radius:14px;padding:12px}.hero-label{font-size:10px;color:var(--muted);font-weight:800}.hero-value{font-size:30px;font-family:"Yu Mincho",serif;font-weight:900;color:var(--gold);margin:3px 0}.hero-note{font-size:11px;color:#625d55;line-height:1.5}.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}.stat-pill{background:#fff;border:1px solid #eee6da;border-radius:12px;padding:10px 4px;text-align:center}.stat-num{font-size:20px;font-weight:900}.stat-cap{font-size:9px;color:var(--muted)}.dash-section{background:rgba(255,255,255,.58);border-radius:15px;padding:12px;margin:10px 0}.dash-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.dash-heading b{font-size:14px}.dash-heading span{font-size:9px;color:var(--muted)}.trend-wrap{height:132px;position:relative}.trend-svg{width:100%;height:100%;overflow:visible}.trend-empty{display:grid;place-items:center;height:100%;font-size:11px;color:var(--muted)}.choice-bars{display:grid;gap:8px}.choice-row{display:grid;grid-template-columns:42px 1fr 54px;gap:7px;align-items:center}.choice-label{font-size:12px;font-weight:900}.bar-track{height:11px;background:#e8e2d8;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,var(--green),#6e9679);border-radius:999px}.choice-value{text-align:right;font-size:11px;font-weight:800;color:var(--green2)}.map-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}.map-cell{aspect-ratio:.72;border-radius:2px;background:#ece7de;border:1px solid #e0d8cc;display:grid;place-items:center;font-size:7px;color:#938b80;font-weight:800}.map-cell.seen{background:#cbdccd;color:#315f42;border-color:#b8cfbb}.map-cell.good{background:#6f997b;color:#fff;border-color:#5e896b}.map-cell.master{background:#315f42;color:#fff;border-color:#315f42;box-shadow:0 0 0 1px rgba(49,95,66,.15)}.map-legend{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px;font-size:8px;color:var(--muted)}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:-1px}.rank-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rank-card{background:#fff;border-radius:12px;padding:10px}.rank-title{font-size:10px;color:var(--muted);font-weight:800;margin-bottom:6px}.rank-item{display:flex;justify-content:space-between;gap:6px;padding:5px 0;border-bottom:1px solid #f0ebe3;font-size:11px}.rank-item:last-child{border-bottom:0}.rank-key{font-family:"Yu Mincho",serif;font-size:15px;font-weight:900}.history{max-height:34dvh;overflow:auto}.hist{background:#fff;border-radius:10px;padding:9px;margin:6px 0;font-size:11px}.hist b{font-size:13px}.delta-up{color:var(--ok);font-weight:900}.delta-down{color:var(--ng);font-weight:900}@media(max-width:420px){.app{padding-left:6px;padding-right:6px}.cards{gap:5px}.poem-col{font-size:clamp(14px,4.55vw,19px)}.cards.six .poem-col{font-size:clamp(12px,3.55vw,16px)}.cards.nine .poem-col{font-size:clamp(10px,3vw,14px)}.stream{font-size:27px}.dash-hero{grid-template-columns:126px 1fr}.ring{width:120px;height:120px}.ring:after{width:88px;height:88px}.ring-num{font-size:25px}.hero-value{font-size:26px}}
</style></head><body><main class="app">
<section id="startScreen" class="page start active"><div class="panel"><h1>百人一首 読み取り</h1><div class="lead">読みが進む中で、分かった瞬間に札を取る。</div><div class="section-title">ユーザー</div><div class="profile-row"><select id="profileSelect"></select><button id="newProfileBtn" class="smallbtn">＋追加</button></div><div class="section-title">① モード</div><div class="tabs"><button class="tabBtn selected" data-mode="training">決まり字トレーニング</button><button class="tabBtn" data-mode="real">本番モード</button></div><div id="modeNote" class="mini">一字・二字決まり中心の10問</div><div class="section-title">② 選択肢</div><div class="choice-buttons"><button class="choiceBtn selected" data-count="3">3択</button><button class="choiceBtn" data-count="6">6択</button><button class="choiceBtn" data-count="9">9択</button></div><div class="section-title">③ 難易度</div><div class="difficulty"><button class="diffBtn selected" data-diff="easy">やさしい<span class="diff-sub">ゆっくり</span></button><button class="diffBtn" data-diff="normal">ふつう<span class="diff-sub">標準</span></button><button class="diffBtn" data-diff="hard">むずかしい<span class="diff-sub">似た札</span></button><button class="diffBtn" data-diff="master">名人<span class="diff-sub">速い＋似た札</span></button></div><button id="startBtn" class="primary">スタート</button><button id="dashBtn" class="primary outline">成績ダッシュボード</button><div class="mini">成績はこの端末のブラウザ内にユーザー別で保存されます。</div></div></section>
<section id="readScreen" class="page"><div class="topbar"><div id="brand" class="brand"></div><button id="flipBtn" class="flipBtn" type="button" aria-label="札を反転" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-5V2"/><path d="M4 17h5v5"/><path d="M19 7a8 8 0 0 0-13-2L4 7"/><path d="M5 17a8 8 0 0 0 13 2l2-2"/></svg></button><div id="progress" class="progress">1 / 10</div></div><div class="stage"><div id="status" class="status"></div><div id="stream" class="stream"></div><div id="help" class="help"></div></div><div id="cards" class="cards"></div><div id="feedback" class="feedback"></div><button id="retryBtn" class="retryBtn" type="button">この問題をやり直す</button></section>
<section id="resultScreen" class="page result"><div class="panel"><div class="lead">10問終了</div><div id="mainResult" class="char-result"></div><div id="summary" class="summary"></div><div id="resultList" class="review-list"></div><button id="againBtn" class="primary full">同じ設定でもう一度</button><button id="resultDashBtn" class="primary outline full">成績を見る</button><button id="homeBtn" class="primary secondary full">設定へ</button></div></section>
<section id="dashScreen" class="page"><div class="panel dash-panel"><div class="dash-kicker">KARUTA GROWTH</div><h1 id="dashTitle">成績</h1><div class="dash-hero"><div id="masterRing" class="ring"><div class="ring-inner"><div id="dMaster" class="ring-num">0%</div><div class="ring-cap">決まり字ぴったり</div></div></div><div class="hero-copy"><div class="hero-label">現在の反応力</div><div id="dAvg" class="hero-value">—</div><div id="dDelta" class="hero-note">プレイすると成長が表示されます。</div></div></div><div class="stat-strip"><div class="stat-pill"><div id="dPlays" class="stat-num">0</div><div class="stat-cap">プレイ回数</div></div><div class="stat-pill"><div id="dQuestions" class="stat-num">0</div><div class="stat-cap">取得した札</div></div><div class="stat-pill"><div id="dRetry" class="stat-num">0%</div><div class="stat-cap">やり直し率</div></div></div><div class="dash-section"><div class="dash-heading"><b>反応タイミングの推移</b><span>最近10プレイ</span></div><div id="trendWrap" class="trend-wrap"></div></div><div class="dash-section"><div class="dash-heading"><b>選択肢別の本番力</b><span>平均＋文字</span></div><div id="choiceBars" class="choice-bars"></div></div><div class="dash-section"><div class="dash-heading"><b>100首マップ</b><span>濃いほど決まり字に近い</span></div><div id="mapGrid" class="map-grid"></div><div class="map-legend"><span><i class="legend-dot" style="background:#ece7de"></i>未挑戦</span><span><i class="legend-dot" style="background:#cbdccd"></i>挑戦中</span><span><i class="legend-dot" style="background:#6f997b"></i>あと少し</span><span><i class="legend-dot" style="background:#315f42"></i>決まり字級</span></div></div><div class="dash-section"><div class="dash-heading"><b>札ごとの特徴</b><span>平均反応</span></div><div class="rank-grid"><div class="rank-card"><div class="rank-title">得意札</div><div id="bestList"></div></div><div class="rank-card"><div class="rank-title">伸びしろ札</div><div id="weakList"></div></div></div></div><div class="dash-section"><div class="dash-heading"><b>最近のプレイ</b><span>最新10件</span></div><div id="history" class="history"></div></div><button id="dashHomeBtn" class="primary secondary">設定へ戻る</button></div></section>
</main><script src="data.js"></script><script src="app.js"></script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f3efe5"><title>百人一首 読み取りトレーニング</title><style>
:root{--bg:#f3efe5;--paper:#fffef9;--ink:#151515;--green:#315f42;--green2:#244a33;--ok:#16804d;--ng:#b43b30;--muted:#746f66;--gold:#a77a20}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100dvh}button{font:inherit}.app{max-width:620px;min-height:100dvh;margin:auto;padding:max(14px,env(safe-area-inset-top)) 9px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.start,.result{flex:1;display:none;align-items:center;justify-content:center;text-align:center}.start.active,.result.active{display:flex}.screen{display:none}.screen.active{display:block}.panel{width:100%;background:rgba(255,255,255,.66);border-radius:18px;padding:23px 16px;box-shadow:0 8px 24px rgba(0,0,0,.07)}.panel h1{font-size:27px;margin:0 0 7px}.panel p{color:var(--muted);line-height:1.58;margin:7px 0 15px}.section-title{font-size:13px;font-weight:800;color:#575249;text-align:left;margin:14px 0 7px}.choice-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choiceBtn,.diffBtn{border:1px solid #d7d0c5;background:#fff;border-radius:11px;padding:12px 4px;font-weight:800;color:#4f4a43}.choiceBtn{font-size:16px}.choiceBtn.selected,.diffBtn.selected{background:var(--green);color:#fff;border-color:var(--green)}.difficulty{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.diffBtn{font-size:12px;padding:10px 2px}.diff-sub{display:block;font-size:9px;font-weight:600;opacity:.78;margin-top:2px}.primary{width:100%;border:0;border-radius:13px;background:var(--green);color:#fff;padding:15px 8px;font-size:18px;font-weight:800;margin-top:16px}.primary:active{background:var(--green2)}.secondary{background:#756e64}.mini{font-size:11px;color:var(--muted);margin-top:11px;line-height:1.55}.topbar{display:flex;justify-content:space-between;align-items:center;min-height:34px}.brand{font-weight:800;font-size:13px}.progress{font-size:13px;color:var(--muted)}.stage{background:#fffaf0;border-radius:16px;padding:9px 7px;margin:5px 0 10px;text-align:center}.status{font-size:11px;color:var(--muted);font-weight:700}.stream{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:31px;font-weight:800;min-height:48px;letter-spacing:.055em;margin:6px 0 1px}.stream .kimari{color:var(--gold);text-decoration:underline;text-underline-offset:5px}.help{font-size:11px;color:#6b655c;min-height:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:start}.card{appearance:none;border:0;background:transparent;padding:0;aspect-ratio:.72;touch-action:manipulation}.front{background:var(--green);padding:5px;border-radius:2px;box-shadow:0 4px 11px rgba(0,0,0,.12);height:100%}.card-inner{height:100%;width:100%;background:var(--paper);display:flex;justify-content:center;align-items:flex-start;padding:9% 4% 6%;overflow:hidden}.poem-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);direction:rtl;align-items:start}.poem-col{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(15px,4.6vw,22px);font-weight:500;line-height:1.1;display:flex;flex-direction:column;align-items:center;white-space:nowrap}.poem-char{display:block;height:1.1em}.card.correct .front{background:var(--ok)}.card.wrong .front{background:var(--ng)}.cards.five .poem-col{font-size:clamp(14px,4.25vw,20px)}.cards.ten{grid-template-columns:repeat(5,1fr);gap:4px}.cards.ten .front{padding:3px}.cards.ten .card-inner{padding:8% 2% 4%}.cards.ten .poem-col{font-size:clamp(9px,2.55vw,14px);line-height:1.03}.cards.ten .poem-char{height:1.03em}.feedback{min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:17px;margin-top:5px}.feedback.ok{color:var(--ok)}.feedback.ng{color:var(--ng)}.char-result{font-family:"Yu Mincho",serif;font-size:31px;font-weight:900;color:var(--gold);margin:6px 0}.summary{font-size:13px;color:#5c574f;line-height:1.6}.review-list{max-height:51dvh;overflow:auto;text-align:left;margin:10px -2px}.read-row{display:flex;justify-content:space-between;gap:8px;background:#fff;border-radius:10px;padding:9px 10px;margin:6px 0}.read-row b{font-family:"Yu Mincho",serif;font-size:19px}.good{color:var(--ok);font-weight:800}.late{color:var(--gold);font-weight:800}.full{width:100%;margin-top:8px}@media(max-width:420px){.app{padding-left:6px;padding-right:6px}.cards{gap:5px}.poem-col{font-size:clamp(14px,4.55vw,19px)}.cards.five .poem-col{font-size:clamp(13px,4.1vw,18px)}.cards.ten{gap:3px}.cards.ten .front{padding:2px}.cards.ten .poem-col{font-size:clamp(8px,2.45vw,11px)}.stream{font-size:27px}.difficulty{gap:4px}.diffBtn{font-size:11px}}
</style></head><body><main class="app"><section id="startScreen" class="start active"><div class="panel"><h1>読み取りトレーニング</h1><p>札の位置を見てから読みが始まります。<br>分かった瞬間に札を取ってください。</p><div class="section-title">① 選択肢</div><div class="choice-buttons"><button class="choiceBtn selected" data-count="3">3択</button><button class="choiceBtn" data-count="5">5択</button><button class="choiceBtn" data-count="10">10択</button></div><div class="section-title">② 難易度</div><div class="difficulty"><button class="diffBtn selected" data-diff="easy">やさしい<span class="diff-sub">ゆっくり</span></button><button class="diffBtn" data-diff="normal">ふつう<span class="diff-sub">標準</span></button><button class="diffBtn" data-diff="hard">むずかしい<span class="diff-sub">似た札</span></button><button class="diffBtn" data-diff="master">名人<span class="diff-sub">速い＋似た札</span></button></div><button id="startBtn" class="primary">トレーニング開始</button><div class="mini">不正解札は百人一首100枚から選択。むずかしい・名人は、下の句の先頭が同じ札を優先します。</div></div></section><section id="readScreen" class="screen"><div class="topbar"><div id="brand" class="brand">3択・やさしい</div><div id="progress" class="progress">1 / 10</div></div><div class="stage"><div id="status" class="status">まず札の位置を見てください</div><div id="stream" class="stream">準備</div><div id="help" class="help">2秒後に読みが始まります</div></div><div id="cards" class="cards"></div><div id="feedback" class="feedback"></div></section><section id="resultScreen" class="result"><div class="panel"><div style="font-size:13px;color:var(--muted);font-weight:800">10問終了</div><div id="mainResult" class="char-result">平均 ＋2.3文字</div><div id="summary" class="summary"></div><div id="resultList" class="review-list"></div><button id="againBtn" class="primary full">同じ設定でもう一度</button><button id="homeBtn" class="primary secondary full">設定を変える</button></div></section></main><script src="data.js"></script><script src="app.js"></script></body></html>

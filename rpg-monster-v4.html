<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>百首異聞｜序章</title><style>:root{--g:#315f42;--gold:#c99a3b;--paper:#fffdf7;--ink:#17130e}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#0b0907;color:#f4ead6;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:430px;min-height:100dvh;margin:auto;padding:14px 12px 32px;background:radial-gradient(circle at 50% 15%,#4b3420,#17110c 52%,#080706)}button{font:inherit}.top{display:flex;justify-content:space-between;align-items:center}.back{border:1px solid #705c3d;background:#20170f;color:#eee0c8;border-radius:999px;padding:8px 12px}.chapter{font-size:10px;color:#dab86c;font-weight:900}.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.meter{background:#1f1710;border:1px solid #57432b;border-radius:12px;padding:8px}.r{display:flex;justify-content:space-between;font-size:10px;font-weight:900}.bar{height:7px;background:#080706;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%}.hp{background:#bd4435}.mp{background:#4f92ad}.name{text-align:center;font-family:"Yu Mincho",serif;font-size:18px;font-weight:900;margin:8px 0 2px}.sub{text-align:center;font-size:9px;color:#b9aa91}.arena{height:355px;border:1px solid #745c38;border-radius:20px;position:relative;overflow:hidden;background:radial-gradient(circle at 72% 18%,#efe0a2 0 38px,transparent 40px),linear-gradient(#10131b,#24180f 60%,#0d0a07)}.torii{position:absolute;left:20px;bottom:18px;width:120px;height:135px;opacity:.5}.torii:before,.torii:after{content:'';position:absolute;background:#6d251e}.torii:before{left:25px;top:25px;width:12px;height:110px;box-shadow:58px 0 #6d251e}.torii:after{left:5px;top:20px;width:100px;height:12px;box-shadow:0 18px #6d251e}.fox{position:absolute;left:46px;top:56px;width:330px;height:250px;filter:drop-shadow(0 18px 18px #000b)}.tail{position:absolute;width:165px;height:95px;border:28px solid #ded8cd;border-left:0;border-bottom:0;border-radius:0 100% 0 0;filter:drop-shadow(0 0 10px #8c8272);transform-origin:left bottom}.t1{right:3px;top:3px;transform:rotate(-25deg)}.t2{right:-3px;top:50px;transform:rotate(0)}.t3{right:14px;top:96px;transform:rotate(24deg)}.body{position:absolute;left:65px;top:75px;width:180px;height:125px;border-radius:54% 48% 42% 48%;background:radial-gradient(circle at 45% 30%,#f0ece5 0,#c7c0b5 35%,#716b63 72%,#292722);box-shadow:inset -20px -20px 30px #17130f88}.neck{position:absolute;left:63px;top:62px;width:90px;height:110px;background:linear-gradient(120deg,#eee9e1,#8b8379 70%);clip-path:polygon(30% 0,100% 20%,70% 100%,0 82%)}.head{position:absolute;left:28px;top:42px;width:105px;height:90px;border-radius:52% 48% 55% 45%;background:radial-gradient(circle at 45% 35%,#f1ede5,#b8b0a4 55%,#575149);transform:rotate(-8deg);box-shadow:inset -12px -12px 18px #211d19aa}.ear{position:absolute;top:-29px;width:42px;height:65px;background:linear-gradient(#d7d0c6,#706860);clip-path:polygon(50% 0,100% 100%,0 100%)}.ea{left:10px;transform:rotate(-17deg)}.eb{right:12px;transform:rotate(18deg)}.eye{position:absolute;top:35px;width:13px;height:5px;background:#d4281d;border-radius:50%;box-shadow:0 0 12px #ef2d22}.e1{left:24px}.e2{right:27px}.snout{position:absolute;left:45px;top:55px;width:20px;height:13px;background:#15120f;border-radius:60%}.mark{position:absolute;left:39px;top:18px;width:33px;height:33px;border-top:4px solid #8e2019;border-left:4px solid transparent;transform:rotate(45deg);opacity:.9}.seal{position:absolute;z-index:7}.s1{left:116px;top:35px}.s2{left:75px;top:174px}.s3{right:18px;top:145px}.card{background:var(--paper);border:5px solid var(--g);box-shadow:0 4px 10px #0008;color:#111;padding:5px 3px;display:grid;grid-template-columns:repeat(3,1fr);direction:ltr;align-items:start}.card .col{writing-mode:vertical-rl;text-orientation:upright;font-family:"Yu Mincho",serif;font-weight:800;font-size:13px;line-height:1.04;justify-self:center}.seal .card{width:47px;height:70px;display:flex;justify-content:center}.seal .card .col{font-size:20px}.seal.dead{opacity:.2;filter:grayscale(1)}.seal.dead:after{content:'破';position:absolute;inset:0;display:grid;place-items:center;color:#d22c20;font-size:30px;font-weight:1000;transform:rotate(-12deg)}.phase{font-size:12px;color:#e3c47d;font-weight:900;margin:14px 0 7px}.hint{font-size:9px;line-height:1.55;color:#b7aa96}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:9px 0}.slot{height:112px;border:2px dashed #846b42;background:#17120d;border-radius:8px;color:#d9c49a;padding:0;display:grid;place-items:center;position:relative}.slot .plus{font-size:25px}.slot .tiny{font-size:8px}.slot.filled{border:0;background:transparent}.slot.filled .card{width:100%;height:112px}.slot.filled:after{content:attr(data-no);position:absolute;left:-2px;top:-2px;width:20px;height:20px;border-radius:50%;background:#1d1811;color:#fff;border:1px solid #d7b05b;font-size:8px;display:grid;place-items:center}.btn{width:100%;border:0;border-radius:14px;background:linear-gradient(#bd842a,#825116);color:#fff;padding:14px;font-weight:900;margin-top:8px}.btn:disabled{opacity:.35}.log{margin-top:9px;background:#0c0a08;border:1px solid #493a28;border-radius:12px;padding:10px;min-height:58px;font-size:10px;line-height:1.65}.overlay{position:fixed;inset:0;background:#000c;z-index:50;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.picker{width:min(430px,100%);height:82dvh;background:#15100b;border-radius:22px 22px 0 0;border:1px solid #7a613b;padding:12px;display:flex;flex-direction:column}.picktop{display:flex;justify-content:space-between;align-items:center}.picktop b{font-family:"Yu Mincho",serif;font-size:18px}.close{width:36px;height:36px;border-radius:50%;background:#2b2117;color:#fff;border:1px solid #856a42}.note{font-size:9px;color:#b8aa93;margin:4px 0 8px}.list{overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding-bottom:20px}.item{border:1px solid #5f4c31;background:#20180f;color:#eee0c8;border-radius:11px;padding:7px;display:grid;grid-template-columns:24px 64px 1fr;gap:6px;align-items:center;text-align:left}.num{width:24px;height:24px;border-radius:50%;background:#0c0a08;border:1px solid #c79d4f;color:#f4d78e;font-size:9px;display:grid;place-items:center}.miniCard{width:60px;height:86px}.miniCard.card .col{font-size:10px}.choose{font-size:9px;line-height:1.4}.choose b{color:#ebc86f}.reward{display:none;text-align:center;background:#f3e7ce;color:#20170e;border-radius:16px;padding:18px;margin-top:10px}.reward.show{display:block}</style></head><body><main class="app"><div class="top"><button class="back" onclick="location.href='index.html'">← TOP</button><span class="chapter">百首異聞｜序章</span></div><div class="hud"><div class="meter"><div class="r"><span>HP</span><span id="hpt">100/100</span></div><div class="bar"><div id="hpf" class="fill hp" style="width:100%"></div></div></div><div class="meter"><div class="r"><span>MP</span><span id="mpt">100/100</span></div><div class="bar"><div id="mpf" class="fill mp" style="width:100%"></div></div></div></div><div class="name">封印から目覚めた 白狐の異形</div><div class="sub">平安の怪異｜筆・墨を基調にした写実寄り創作</div><div id="arena" class="arena"><div class="torii"></div><div class="fox"><div class="tail t1"></div><div class="tail t2"></div><div class="tail t3"></div><div class="body"></div><div class="neck"></div><div class="head"><i class="ear ea"></i><i class="ear eb"></i><i class="eye e1"></i><i class="eye e2"></i><i class="snout"></i><i class="mark"></i></div><div class="seal s1" data-k="ちは"></div><div class="seal s2" data-k="おく"></div><div class="seal s3" data-k="む"></div></div></div><div class="phase">歌珠を5枚選ぶ</div><div class="hint">最初は5枠とも空です。空いている枠をタップして、百人一首100首から下の句札を1枚ずつ選択します。並び順は小倉百人一首の公式番号1〜100です。</div><div id="slots" class="slots"></div><button id="start" class="btn" disabled>5枚を選んで戦闘開始</button><div id="log" class="log">怪異の身体には「ちは」「おく」「む」の三つの封印札が残っている……。</div><div id="reward" class="reward"><b>怪異討伐</b><p>三枚の封印札を破壊した。<br>歌のカケラ ×3 を獲得。</p><button class="btn" onclick="location.reload()">再戦する</button></div></main><div id="overlay" class="overlay"><div class="picker"><div class="picktop"><b>下の句札を選ぶ</b><button class="close" onclick="closePicker()">×</button></div><div class="note">小倉百人一首 1番 → 100番の順。札内の文字は左の列から始まる表示に統一しています。</div><div id="list" class="list"></div></div></div><script src="data.js"></script><script>const exact={5:'おく',17:'ちは',87:'む'};const tags={5:'秋',17:'秋',23:'秋',24:'秋',40:'恋',41:'恋',43:'恋',57:'月',70:'秋',77:'恋',81:'月',87:'秋'};let selected=[null,null,null,null,null],activeSlot=0,started=false,hp=100,mp=100;function cols(s){const a=String(s).replace(/\s/g,'').split(''),n=Math.ceil(a.length/3);return [0,1,2].map(i=>a.slice(i*n,(i+1)*n).join(''))}function card(s,cl=''){return `<div class="card ${cl}">${cols(s).map(x=>`<span class="col">${x}</span>`).join('')}</div>`}document.querySelectorAll('.seal').forEach(s=>s.innerHTML=card(s.dataset.k));function renderSlots(){slots.innerHTML=selected.map((id,i)=>id?`<button class="slot filled" data-no="${id}" onclick="openPicker(${i})">${card(ALL_LOWER[id-1].lower)}</button>`:`<button class="slot" onclick="openPicker(${i})"><div><div class="plus">＋</div><div class="tiny">札を選ぶ</div></div></button>`).join('');start.disabled=selected.some(x=>!x)}function openPicker(i){if(started)return;activeSlot=i;overlay.classList.add('show');renderList()}function closePicker(){overlay.classList.remove('show')}function renderList(){list.innerHTML=ALL_LOWER.map((p,i)=>{const no=i+1,used=selected.includes(no);return `<button class="item" ${used?'disabled':''} onclick="choose(${no})"><span class="num">${no}</span>${card(p.lower,'miniCard')}<span class="choose"><b>${no}番</b><br>${used?'選択済み':'この札を選ぶ'}</span></button>`}).join('')}function choose(no){selected[activeSlot]=no;closePicker();renderSlots()}start.onclick=()=>{started=true;start.textContent='攻撃する札をタップ';renderSlots();document.querySelectorAll('.slot.filled').forEach((b,i)=>b.onclick=()=>attack(selected[i]));const autumn=selected.filter(x=>tags[x]==='秋').length;if(autumn>=3)log.innerHTML='<b>《秋風共鳴》発動！</b> 秋の札が3首つながり、与ダメージが上昇した。';else log.textContent='歌珠を展開。攻撃する下の句札を選べ。'};function attack(no){const k=exact[no],target=k?[...document.querySelectorAll('.seal:not(.dead)')].find(s=>s.dataset.k===k):null;if(target){target.classList.add('dead');log.innerHTML=`<b>一首接続！</b> ${no}番の下の句が「${k}」につながり、封印札を一撃破壊。`}else{mp=Math.max(0,mp-20);hp=Math.max(0,hp-8);log.innerHTML=`${no}番の札で攻撃。完全一致ではないため怪異の反撃を受けた。`;hpt.textContent=hp+'/100';mpt.textContent=mp+'/100';hpf.style.width=hp+'%';mpf.style.width=mp+'%'}if(!document.querySelector('.seal:not(.dead)'))setTimeout(()=>{arena.style.opacity=.3;reward.classList.add('show');log.innerHTML='<b>三札撃破。白狐の異形を討伐した。</b>'},450)}renderSlots();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>百首異聞｜異形戦</title><style>:root{--g:#315f42;--paper:#f7f0df;--ink:#1d1812;--gold:#d0a44b;--red:#9d3228}*{box-sizing:border-box}body{margin:0;background:#17130e;color:#f8efd9;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:430px;min-height:100dvh;margin:auto;padding:14px 12px 30px;background:radial-gradient(circle at 50% 20%,#4b3924,#19140e 55%,#090807)}button{font:inherit}.top{display:flex;justify-content:space-between;align-items:center}.back{border:1px solid #756344;background:#241c13;color:#eee0c4;border-radius:999px;padding:8px 12px}.chapter{font-size:10px;color:#d9b86e;letter-spacing:.12em;font-weight:900}.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.meter{background:#241c13;border:1px solid #5b4930;border-radius:12px;padding:8px}.row{display:flex;justify-content:space-between;font-size:10px;font-weight:900}.bar{height:7px;background:#080706;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%}.hp{background:#bd4435}.mp{background:#4c8ca8}.arena{height:340px;border:1px solid #6b5739;border-radius:20px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 64%,#614527 0,#251b12 46%,#0b0907 100%)}.moon{position:absolute;right:28px;top:22px;width:75px;height:75px;border-radius:50%;background:#e9d9a6;box-shadow:0 0 35px #dfc87c66}.monster{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:245px;height:205px;filter:drop-shadow(0 15px 14px #000)}.body{position:absolute;left:43px;top:50px;width:160px;height:118px;border-radius:50% 48% 42% 50%;background:radial-gradient(circle at 55% 35%,#d8d0c0,#7e756a 42%,#26231f 75%);border:4px solid #15120f}.tail{position:absolute;width:100px;height:35px;border:12px solid #716a61;border-left:0;border-bottom:0;border-radius:0 100% 0 0;transform-origin:left center}.t1{left:150px;top:78px;transform:rotate(-30deg)}.t2{left:155px;top:105px;transform:rotate(2deg)}.t3{left:145px;top:130px;transform:rotate(27deg)}.ear{position:absolute;top:32px;width:48px;height:60px;background:#80786e;border:4px solid #17130f;clip-path:polygon(50% 0,100% 100%,0 100%)}.e1{left:62px;transform:rotate(-18deg)}.e2{left:136px;transform:rotate(18deg)}.face{position:absolute;left:79px;top:69px;width:93px;height:76px;border-radius:50%;background:#c9c1b4;border:3px solid #18140f}.eye{position:absolute;top:25px;width:9px;height:5px;background:#c42f22;box-shadow:0 0 10px #e33}.eye.a{left:25px}.eye.b{right:25px}.snout{position:absolute;left:40px;top:42px;width:14px;height:9px;background:#18130f;border-radius:50%}.ink{position:absolute;inset:0;background:repeating-radial-gradient(ellipse at 50% 60%,transparent 0 35px,#0002 37px 39px,transparent 42px 55px);mix-blend-mode:multiply}.seal{position:absolute;z-index:5}.s1{left:84px;top:36px}.s2{left:45px;top:135px}.s3{right:20px;top:115px}.card{width:52px;height:78px;background:#fffdf5;border:5px solid var(--g);box-shadow:0 3px 8px #0008;display:flex;justify-content:space-around;align-items:flex-start;padding:5px 3px;color:#15130f}.card span{writing-mode:vertical-rl;text-orientation:upright;font-family:"Yu Mincho",serif;font-size:12px;font-weight:800;line-height:1.05}.seal .card{width:45px;height:66px}.seal .card span{font-size:17px;font-weight:900}.seal.dead{opacity:.25;filter:grayscale(1)}.seal.dead:after{content:'破';position:absolute;inset:0;display:grid;place-items:center;color:#d52b20;font-size:31px;font-weight:1000;transform:rotate(-12deg)}.name{text-align:center;font-family:"Yu Mincho",serif;font-weight:900;font-size:17px;margin:8px 0 1px}.sub{text-align:center;font-size:9px;color:#c5b699}.phase{font-size:12px;color:#e1c582;font-weight:900;margin:13px 0 6px}.hint{font-size:9px;color:#b4a58e;line-height:1.55}.pool{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:9px 0}.choice{border:0;background:transparent;padding:0;display:flex;justify-content:center}.choice .card{width:68px;height:104px}.choice .card span{font-size:13px}.choice.selected .card{box-shadow:0 0 0 3px #f3cb64,0 0 22px #f1bb4c}.btn{width:100%;border:0;border-radius:14px;background:linear-gradient(#b67d28,#835116);color:white;padding:14px;font-weight:900;margin-top:8px}.log{margin-top:9px;background:#0d0b08;border:1px solid #493a28;border-radius:12px;padding:10px;min-height:60px;font-size:10px;line-height:1.65}.fx{position:absolute;inset:0;pointer-events:none;z-index:9;display:none}.fx.on{display:block;animation:flash .8s ease}.fx:before{content:'🍁  🍂  🍁  🍂  🍁';position:absolute;inset:0;font-size:29px;letter-spacing:15px;animation:fall .8s linear}@keyframes fall{from{transform:translateY(-70px) rotate(0)}to{transform:translateY(330px) rotate(70deg)}}@keyframes flash{0%{background:#fff8}100%{background:transparent}}.reward{display:none;text-align:center;background:#f4ead4;color:#20180f;border-radius:17px;padding:18px;margin-top:12px}.reward.show{display:block}.shard{font-size:48px;color:#c99731}.strict{font-size:9px;color:#cdbd9f;margin-top:7px;text-align:center}</style></head><body><main class="app"><div class="top"><button class="back" onclick="location.href='index.html'">← TOP</button><span class="chapter">序章｜歌喰いの森</span></div><div class="hud"><div class="meter"><div class="row"><span>HP</span><span id="hpt">100/100</span></div><div class="bar"><div id="hpf" class="fill hp" style="width:100%"></div></div></div><div class="meter"><div class="row"><span>MP</span><span id="mpt">100/100</span></div><div class="bar"><div id="mpf" class="fill mp" style="width:100%"></div></div></div></div><div class="name">白狐の異形</div><div class="sub">怪談・妖異伝承を下敷きにした創作異形｜墨筆画調</div><div id="arena" class="arena"><div class="moon"></div><div class="monster"><div class="tail t1"></div><div class="tail t2"></div><div class="tail t3"></div><div class="ear e1"></div><div class="ear e2"></div><div class="body"></div><div class="face"><i class="eye a"></i><i class="eye b"></i><i class="snout"></i></div><div class="ink"></div><div class="seal s1" data-k="ちは"></div><div class="seal s2" data-k="おく"></div><div class="seal s3" data-k="む"></div></div><div id="fx" class="fx"></div></div><div class="strict">異形の身体にある3枚も、攻撃に使う札も、すべてトレーニングと同じ「緑枠・白札・縦書き3列」を共通規格にします。</div><div class="phase">歌珠を5枚選ぶ</div><div class="hint">身体の3箇所に封じられた決まり字札をすべて破壊すると異形を討伐。対応する下の句なら一首接続で札を一撃破壊します。</div><div id="pool" class="pool"></div><button id="start" class="btn">5枚を決定</button><div id="log" class="log">白狐の身体に、三枚の札が浮かんでいる……。</div><div id="reward" class="reward"><div class="shard">✦</div><b>異形討伐</b><p>三枚の封印札をすべて破壊した。<br>白狐は墨のように崩れ、歌のカケラを残した。</p><b>歌のカケラ ×3 獲得</b><button class="btn" onclick="location.reload()">再戦する</button></div></main><script>const P=[{k:'ちは',l:'からくれなゐに みづくくるとは',t:'秋'},{k:'おく',l:'こゑきくときぞ あきはかなしき',t:'秋'},{k:'む',l:'きりたちのぼる あきのゆふぐれ',t:'秋'},{k:'さ',l:'いづこもおなじ あきのゆふぐれ',t:'秋'},{k:'つき',l:'わがみひとつの あきにはあらねど',t:'月'}];let sel=[],hp=100,mp=100,started=false;function cols(s){const a=s.replace(/ /g,'').split('');let n=Math.ceil(a.length/3),out=[];for(let i=0;i<3;i++)out.push(a.slice(i*n,(i+1)*n).join(''));return out}function card(txt){return `<div class="card">${cols(txt).map(x=>`<span>${x}</span>`).join('')}</div>`}document.querySelectorAll('.seal').forEach(x=>x.innerHTML=card(x.dataset.k));function render(){pool.innerHTML=P.map((p,i)=>`<button class="choice ${sel.includes(i)?'selected':''}" onclick="pick(${i})">${card(p.l)}</button>`).join('');start.disabled=sel.length!==5}function pick(i){if(started)return;let n=sel.indexOf(i);if(n>=0)sel.splice(n,1);else if(sel.length<5)sel.push(i);render()}start.onclick=()=>{if(sel.length!==5)return;started=true;start.textContent='攻撃する札をタップ';log.innerHTML='秋の歌が3首以上つながった。<b>《秋風共鳴》</b>発動！ 与ダメージUP。';fx.classList.add('on');setTimeout(()=>fx.classList.remove('on'),800);document.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>attack(i))};function attack(i){if(!started)return;let p=P[i],target=[...document.querySelectorAll('.seal:not(.dead)')].find(s=>s.dataset.k===p.k);if(target){target.classList.add('dead');log.innerHTML=`<b>一首接続！</b> 「${p.k}」の封印札を一撃破壊。`;fx.classList.add('on');setTimeout(()=>fx.classList.remove('on'),700)}else{mp=Math.max(0,mp-20);hp=Math.max(0,hp-8);log.innerHTML=`${p.t}のつながりで攻撃。しかし完全一致ではない。異形の反撃を受けた。`;hpt.textContent=hp+'/100';mpt.textContent=mp+'/100';hpf.style.width=hp+'%';mpf.style.width=mp+'%'}if(!document.querySelector('.seal:not(.dead)')){setTimeout(()=>{arena.style.opacity=.25;reward.classList.add('show');log.innerHTML='<b>三札撃破！ 白狐の異形を討伐した。</b>'},600)}}render();</script></body></html>
